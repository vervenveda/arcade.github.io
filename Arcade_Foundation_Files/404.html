<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b13">
  <title>Cabinet Not Found | Arcade™</title>
  <style>
    :root{
      --black:#080b13;
      --wall:#101722;
      --panel:#141d2a;
      --ink:#e7e8e4;
      --soft:#b8bec4;
      --muted:#858f9b;
      --cyan:#63cddd;
      --cyan-soft:#9ee8ef;
      --pink:#cf6ca8;
      --line:rgba(158,232,239,.22);
      --radius:7px;
    }
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:33px 14px;
      color:var(--ink);
      background:
        radial-gradient(circle at 20% 0,rgba(99,205,221,.09),transparent 28rem),
        radial-gradient(circle at 86% 8%,rgba(207,108,168,.08),transparent 26rem),
        var(--black);
      font-family:"Avenir Next","Helvetica Neue","Segoe UI",sans-serif;
      line-height:1.7;
      text-align:center;
    }
    main{
      width:min(100%,720px);
      padding:55px 33px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(16,23,34,.92);
    }
    .code{
      margin:0;
      color:var(--pink);
      font:400 14px/1.2 "Courier New",monospace;
      letter-spacing:.22em;
      text-transform:uppercase;
    }
    h1{
      margin:24px 0 0;
      color:var(--cyan-soft);
      font-size:clamp(33px,8vw,66px);
      font-weight:400;
      line-height:1;
      letter-spacing:.03em;
    }
    p{
      max-width:560px;
      margin:24px auto 0;
      color:var(--soft);
      font-size:14px;
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:11px;
      margin-top:33px;
    }
    a{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:11px 17px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      color:var(--ink);
      background:var(--panel);
      text-decoration:none;
      font:400 11px/1.4 "Courier New",monospace;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    a:first-child{
      color:var(--black);
      background:var(--cyan-soft);
      border-color:var(--cyan-soft);
    }
    a:focus-visible{outline:3px solid var(--cyan-soft);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404 · Cabinet Offline</p>
    <h1>This game room could not be found.</h1>
    <p>The cabinet may have been renamed, moved, or removed during an Arcade update. Return to the game hall to search the current verified registry.</p>
    <div class="actions">
      <a href="/arcade.github.io/">Return to Arcade</a>
      <a href="https://vervenveda.github.io/">Verve N Veda</a>
    </div>
  </main>
</body>
</html>
